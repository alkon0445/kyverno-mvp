apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - monitoring
                - ingress-nginx
                - local-path-storage
      validate:
        message: "Privileged-контейнеры запрещены."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
