apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-limits-test
policies:
  - ../../policies/require-limits.yaml
resources:
  - resources.yaml
results:
  - policy: require-limits
    rule: require-memory-limit
    kind: Pod
    resources:
      - good-pod
    result: pass
  - policy: require-limits
    rule: require-memory-limit
    kind: Pod
    resources:
      - bad-pod-no-limits
    result: fail
